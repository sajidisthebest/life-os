<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0b111b"/><title>Life OS — Your personal command center</title><link rel="stylesheet" href="/static/style.css"/><link rel="stylesheet" href="/static/themes.css"/></head><body>
<div id="login-screen" class="login-screen hidden"><div class="login-card"><div class="brand-brand"><span class="brand-spark">✦</span> Life<span class="brand-dim">OS</span></div><h1>Welcome back.</h1><p>Your private personal command center.</p><form id="login-form"><label for="password">Workspace password</label><input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required/><button class="btn primary login-btn" type="submit">Unlock workspace <span>↗</span></button></form><div class="login-error" id="login-error"></div><div class="small muted">Your private data stays on your own server.</div></div></div>
<div id="app" class="app hidden">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-spark">✦</span><span>Life<span class="brand-dim">OS</span></span><span class="brand-pill">PERSONAL</span></div><div class="sidebar-caption">WORKSPACE</div><nav id="nav" class="nav"></nav><div class="sidebar-bottom"><div class="sidebar-caption integration-header">INTEGRATIONS <button class="icon-btn tiny" title="Manage integrations" data-page="settings">+</button></div><div class="sidebar-integrations" id="side-integrations"></div><div class="profile"><div class="profile-avatar">S</div><div><strong id="profile-name">My Workspace</strong><small>Private workspace</small></div><button class="icon-btn" id="logout-btn" title="Sign out"><span data-icon="log-out"></span></button></div></div></aside>
<div class="overlay" id="sidebar-overlay"></div>
<main class="main"><header class="topbar"><button class="icon-btn mobile-only" id="menu-toggle" aria-label="Open navigation"><span data-icon="menu"></span></button><button class="search-trigger" id="search-trigger"><span data-icon="search"></span><span class="search-placeholder">Search tasks, emails, events, notes...</span><kbd>⌘ K</kbd></button><div class="topbar-actions"><div class="theme-switcher"><button id="theme-toggle" class="icon-btn" type="button" title="Choose color theme" aria-label="Choose color theme" aria-haspopup="true" aria-expanded="false"><span data-icon="sun"></span></button><div class="theme-menu hidden" id="theme-menu" role="group" aria-label="Choose color theme"></div></div><button class="icon-btn notif-btn" data-page="settings" title="Settings & integrations"><span data-icon="settings"></span></button><div class="time-block"><div id="today-label">—</div><strong id="clock">—</strong></div><div class="top-avatar">S</div></div></header><div id="main-content" class="main-content"></div><footer class="footer">LIFE OS <span>•</span> PRIVATE WORKSPACE <span>•</span> All timestamps in Asia/Dhaka <span class="footer-right" id="footer-sync"></span></footer></main>
<nav id="mobile-nav" class="mobile-nav"></nav>
</div>
